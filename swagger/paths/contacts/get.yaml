tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a paginated list of user contacts with optional filtering by type and favourite status, and sorting by various fields.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
      example: 1
  - name: perPage
    in: query
    description: Number of contacts per page (maximum 100)
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
      example: 10
  - name: sortBy
    in: query
    description: Field to sort contacts by
    required: false
    schema:
      type: string
      enum:
        [
          name,
          phoneNumber,
          email,
          contactType,
          isFavourite,
          createdAt,
          updatedAt,
        ]
      default: name
      example: name
  - name: sortOrder
    in: query
    description: Sort order (ascending or descending)
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
      example: asc
  - name: type
    in: query
    description: Filter contacts by type
    required: false
    schema:
      type: string
      enum: [work, home, personal]
      example: personal
  - name: isFavourite
    in: query
    description: Filter contacts by favourite status
    required: false
    schema:
      type: string
      enum: ['true', 'false']
      example: false
responses:
  '200':
    description: Contacts retrieved successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  description: Current page number
                  example: 1
                perPage:
                  type: integer
                  description: Number of items per page
                  example: 10
                totalItems:
                  type: integer
                  description: Total number of contacts
                  example: 25
                totalPages:
                  type: integer
                  description: Total number of pages
                  example: 3
                hasPreviousPage:
                  type: boolean
                  description: Whether there is a previous page
                  example: false
                hasNextPage:
                  type: boolean
                  description: Whether there is a next page
                  example: true
  '400':
    description: Invalid query parameters
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Page must be a positive number'
            data:
              type: string
              example: 'Page must be a positive number'
  '401':
    description: Unauthorized - invalid or missing access token
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Please provide Authorization header'
            data:
              type: string
              example: 'Please provide Authorization header'
