tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve a specific contact by its unique identifier. Only contacts belonging to the authenticated user can be accessed.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: The unique identifier of the contact to retrieve
    schema:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
      example: '65f1234567890abcdef123456'
responses:
  '200':
    description: Contact found successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contact with id 65f1234567890abcdef123456!'
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    description: Invalid contact ID format
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid contact ID format'
            data:
              type: string
              example: 'Invalid contact ID format'
  '401':
    description: Unauthorized - invalid or missing access token
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Please provide Authorization header'
            data:
              type: string
              example: 'Please provide Authorization header'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
            data:
              type: string
              example: 'Contact not found'
